<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joe Webber</title>
<meta name="description" content="Joe Webber — Chief Product Officer at Good Growth, based in Exeter.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f3ec;
    --ink: #2b2b2b;
    --muted: #5c5a55;
    --rule: rgba(43, 43, 43, 0.18);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    background: var(--bg);
    color: var(--ink);
    font-family: Newsreader, Georgia, "Times New Roman", serif;
  }
  main { width: 100%; max-width: 30rem; display: flex; flex-direction: column; gap: 28px; }
  h1 { font-weight: 500; font-size: clamp(40px, 7vw, 56px); line-height: 1.05; letter-spacing: -0.01em; margin: 0; }
  p { font-size: 20px; line-height: 1.5; margin: 0; }
  .place { font-style: italic; color: var(--muted); }
  hr { border: 0; height: 1px; background: var(--rule); margin: 0; }
  nav { display: flex; gap: 24px; flex-wrap: wrap; font-size: 18px; }
  a {
    color: var(--ink);
    text-decoration: underline;
    text-decoration-color: rgba(43, 43, 43, 0.3);
    text-decoration-thickness: 1px;
    text-underline-offset: 4px;
  }
  a:hover { text-decoration-color: var(--ink); }
  ::selection { background: var(--ink); color: var(--bg); }
</style>
</head>
<body>
  <main>
    <h1>Joe Webber</h1>
    <p>Chief Product Officer at Good&nbsp;Growth.<br><span class="place">Exeter, UK</span></p>
    <hr>
    <nav>
      <a href="https://www.linkedin.com/in/joe-webber-18254b16/" target="_blank" rel="noopener">LinkedIn</a>
      <a href="https://github.com/joewebber" target="_blank" rel="noopener">GitHub</a>
    </nav>
  </main>
</body>
</html>
