name: Build MPC Sampler APK

on:
  workflow_dispatch:
  push:
    branches: [ccr-f3553b29-qwjg64]
    paths:
      - 'experiments/mpc-sampler/**'
      - '.github/workflows/mpc-sampler-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/mpc-sampler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: experiments/mpc-sampler/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: experiments/mpc-sampler/android
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk mpc-sampler.apk
          gh release create "mpc-sampler-${{ github.run_number }}" mpc-sampler.apk \
            --title "MPC Sampler build ${{ github.run_number }}" \
            --notes "Debug-signed APK for sideloading." --prerelease --target "${{ github.sha }}"
