[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  # Source map uploads also require POSTHOG_API_KEY, POSTHOG_PROJECT_ID,
  # and POSTHOG_HOST in Netlify's site environment variables.
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
